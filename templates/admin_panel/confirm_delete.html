{% extends "admin_panel/base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="stat-card rounded-2xl p-8 border border-red-500/20 text-center space-y-6"
       style="background: linear-gradient(135deg, rgba(239, 68, 68, 0.05) 0%, rgba(15, 23, 42, 0.4) 100%);">
    
    <div class="w-16 h-16 mx-auto rounded-full bg-red-500/10 border border-red-500/25 flex items-center justify-center text-red-400 text-2xl">
      ⚠️
    </div>

    <div class="space-y-2">
      <h2 class="text-xl font-bold dark:text-white text-slate-900">Are you absolutely sure?</h2>
      <p class="dark:text-gray-400 text-slate-600 text-sm leading-relaxed">
        This action cannot be undone. You are about to permanently delete:<br/>
        <strong class="dark:text-white text-slate-900">"{{ item }}"</strong>
      </p>
    </div>

    <div class="pt-4 flex flex-col sm:flex-row gap-3 justify-center">
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="w-full sm:w-auto px-8 py-3 bg-red-600 hover:bg-red-500 text-white rounded-xl font-semibold text-sm transition-colors">
          Yes, Delete It
        </button>
      </form>
      <a href="{% url cancel_url %}" class="w-full sm:w-auto px-8 py-3 glass hover:dark:bg-white/10 bg-black/5 dark:text-gray-300 text-slate-700 rounded-xl font-semibold text-sm transition-colors flex items-center justify-center">
        No, Cancel
      </a>
    </div>

  </div>
</div>
{% endblock %}
